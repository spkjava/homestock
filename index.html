<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ซื้อยังจ้ะ">
  <meta name="theme-color" content="#f5f6fa">
  <title>📦 ของใช้ในบ้าน</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app-container">

    <!-- Header -->
    <header class="app-header">
      <span class="app-header__icon">🏠</span>
      <h1 class="app-header__title">HOME STOCK</h1>
      <p class="app-header__subtitle">จัดการของใช้ในบ้าน</p>
    </header>

    <!-- Location Manager -->
    <section class="glass-card" id="location-section">
      <div class="card-title">
        <span class="card-title__icon">📍</span>
        สถานที่
      </div>
      <form class="location-bar" id="location-form">
        <input type="text" id="location-name" placeholder="เพิ่มสถานที่ใหม่ เช่น บ้าน, คอนโด, หอพัก..." required>
        <button type="submit" class="btn btn-primary">เพิ่ม</button>
      </form>
      <div class="location-tabs" id="location-tabs">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- Stock Section (dynamically rendered) -->
    <div id="stock-section">
      <!-- Rendered by JS -->
    </div>

  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="app.js"></script>
</body>

</html>
